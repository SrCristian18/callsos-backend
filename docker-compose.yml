version: '3.8'

services:

  # ── Base de Datos MySQL ──────────────────────────────────────────────────
  mysql_db:
    image: mysql:8.0
    container_name: callsos-bd
    restart: always
    env_file:
      - .env  # Docker buscará las variables aquí
    environment:
      # Estas variables se llenarán con los valores del archivo .env
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Mapeo de la carpeta database en la raíz para ejecutar los .sql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - red-callsos

    # HEALTHCHECK: el backend no arrancará hasta que MySQL esté listo
    # para aceptar conexiones. Sin esto, Spring falla al intentar conectarse
    # mientras MySQL aún está inicializando (especialmente en el primer arranque
    # cuando ejecuta los scripts .sql, que puede tardar varios segundos).
    #
    # interval: cada cuánto se verifica
    # timeout: máximo que puede tardar el check
    # retries: cuántos fallos consecutivos antes de marcar como unhealthy
    # start_period: tiempo de gracia al inicio (MySQL tarda en arrancar)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  # ── Backend Spring Boot ──────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: callsos-backend
    restart: always
    env_file:
      - .env
    environment:
      # Spring leerá estas variables para la conexión
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql_db:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

    # depends_on con condition: service_healthy garantiza que el backend
    # espera a que MySQL pase el healthcheck antes de intentar conectarse.
    # Sin "condition", depends_on solo garantiza que el contenedor INICIÓ,
    # no que la BD esté lista para aceptar conexiones.
    depends_on:
      mysql_db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - red-callsos

  # ── Frontend Flutter ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ../callsos-frontend
      dockerfile: Dockerfile
    container_name: callsos-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - red-callsos

volumes:
  mysql_data:

networks:
  red-callsos:
    driver: bridge