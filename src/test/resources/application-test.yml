## YAML Template.
---
spring:
  datasource:
    url: jdbc:h2:mem:callsos_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
 
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql
# ── JWT para tests ────────────────────────────────────────────────────────────
# Secret de prueba con longitud suficiente (>=32 chars).
# SOLO para entorno de test — nunca en producción.
jwt:
  secret: callsos-test-secret-key-only-for-unit-and-integration-tests-not-production
  expiration-ms: 3600000