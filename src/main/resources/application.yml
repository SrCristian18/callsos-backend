spring:
  application:
    name: callsos-backend

  datasource:
    # Si no existen, usará lo que está después de los dos puntos como respaldo.
    #                           -a partir de aqui es el respaldo
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/callsos-bd?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none     # Cambiado a 'none' para evitar conflictos con la inicialización manual de Docker
    show-sql: true       # Para que puedan ver las consultas en la consola de Docker
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  port: 8080 # El puerto que expusimos en el Dockerfile y Compose