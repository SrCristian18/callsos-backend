spring:
  application:
    name: callsos-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/callsos_bd?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080

# ── JWT ──────────────────────────────────────────────────────────────────────
# JWT_SECRET es OBLIGATORIO en producción.
# Si no está definido, JwtService lanza IllegalStateException al arrancar.
# Para desarrollo local se puede usar el valor por defecto SOLO en pruebas,
# nunca en un entorno accesible desde internet.
#
# Generar un secret seguro:
#   openssl rand -base64 64
#   o: python3 -c "import secrets; print(secrets.token_urlsafe(64))"
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}

# ── CORS ─────────────────────────────────────────────────────────────────────
# Origen adicional permitido para producción.
# Dejar vacío en desarrollo (localhost ya está incluido por defecto en CorsConfig).
cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}

#Simular recorrido de agente (solo para las pruebas piloto)
simulacion:
  habilitada: ${SIMULACION_HABILITADA:false}
  velocidad-kmh: ${SIMULACION_VELOCIDAD:35}
  intervalo-ms: ${SIMULACION_INTERVALO_MS:2000}
  osrm:
    url: ${SIMULACION_OSRM_URL:https://router.project-osrm.org}
    timeout-ms: ${SIMULACION_OSRM_TIMEOUT_MS:4000}

# ── ETA (Épica 4) ────────────────────────────────────────────────────────────
# Velocidad media asumida para estimar el tiempo de llegada del agente al
# denunciante — no es la velocidad real (esa solo se conoce con GPS +
# tráfico en tiempo real, fuera de alcance de esta épica). 30 km/h es un
# valor conservador para tránsito urbano de Cartagena; ajustable por env
# sin redeploy si la calibración piloto sugiere otro valor.
eta:
  velocidad-media-kmh: ${ETA_VELOCIDAD_MEDIA_KMH:30}