spring:
  application:
    name: callsos-backend

  datasource:
    # Si no existen, usará lo que está después de los dos puntos como respaldo.
    #                           -a partir de aqui es el respaldo
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/callsos_bd?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JDBC puro — sin Hibernate ni EntityManager.
  # Se eliminó la sección jpa porque el proyecto usa JdbcTemplate directamente.
  # spring-boot-starter-data-jpa fue reemplazado por spring-boot-starter-jdbc
  # en el pom.xml, lo que elimina el ruido de Hibernate en los logs de arranque.

server:
  port: 8080 # El puerto que expusimos en el Dockerfile y Compose
  
# ── JWT ─────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:callsos-secret-key-must-be-at-least-256-bits-for-HS256-algorithm}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}  
  
# ── WebSocket ─────────────────────────────────────────────────────────────────
# No requiere configuración adicional en yml — WebSocketConfig.java lo gestiona.
# El endpoint /ws está disponible en ws://host:8080/ws
 
# ── Firebase ──────────────────────────────────────────────────────────────────
# serviceAccountKey.json debe estar en src/main/resources/
# En Docker se puede montar como volumen o secret.
# Agregar al .gitignore: src/main/resources/serviceAccountKey.json