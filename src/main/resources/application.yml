spring:
  application:
    name: callsos-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/callsos-bd?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080

# ── JWT ──────────────────────────────────────────────────────────────────────
# JWT_SECRET es OBLIGATORIO en producción.
# Si no está definido, JwtService lanza IllegalStateException al arrancar.
# Para desarrollo local se puede usar el valor por defecto SOLO en pruebas,
# nunca en un entorno accesible desde internet.
#
# Generar un secret seguro:
#   openssl rand -base64 64
#   o: python3 -c "import secrets; print(secrets.token_urlsafe(64))"
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ── CORS ─────────────────────────────────────────────────────────────────────
# Origen adicional permitido para producción.
# Dejar vacío en desarrollo (localhost ya está incluido por defecto en CorsConfig).
cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}